# Managed by the @ghostry meta repo (.templates/workflows/generate.ts). Edit it
# there and run `bun .scripts/sync.ts`; changes made here are overwritten.
name: Test

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: >-
          The package's id: the repo name for a single-package repo, or its
          directory name under `pkg/`. One job per package, so a package that
          fails blocks only its own dependents and its own release.
      path:
        required: true
        type: string
        description: The package directory relative to the repo root (`.` or `pkg/<id>`).
      build-run-id:
        required: true
        type: string
        description: The run ID of the build workflow that generated the artifacts to test.

jobs:
  test:
    name: Test
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      ##
      # Suites resolve packages through built output rather than source, so
      # the package's own `dist` has to be in place, and so does the `dist`
      # of every in-repo package it depends on.
      #
      - name: Download `${{ inputs.package }}`
        uses: actions/download-artifact@v8
        with:
          name: pkg-${{ inputs.package }}
          path: ${{ inputs.path }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build-run-id }}
          repository: ${{ github.repository }}

      - name: Test
        run: bun --cwd=${{ inputs.path }} run test
