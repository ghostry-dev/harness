# Managed by the @ghostry meta repo (.templates/workflows/generate.ts). Edit it
# there and run `bun .scripts/sync.ts`; changes made here are overwritten.
name: Build and Test

on:
  pull_request:
    branches: ["*"]

jobs:
  build-harness:
    name: Build `harness`
    uses: ./.github/workflows/build.yml
    with:
      package: harness
      path: .

  test-harness:
    name: Test `harness`
    uses: ./.github/workflows/test.yml
    needs: [build-harness]
    permissions:
      actions: read
    with:
      package: harness
      path: .
      build-run-id: ${{ needs.build-harness.outputs.run-id }}
